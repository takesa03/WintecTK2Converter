; オーバーレイ表示のレイアウト（VSD のスキンに相当）
; 座標・大きさは 1920x1080 を基準にした画素数。ほかの解像度では自動で拡大縮小する
; anchor = 基準にする画面の隅（topleft / topright / bottomleft / bottomright）
; x, y   = その隅から部品の同じ隅までの距離（内側が正）。メーターは画像の見えている部分の端で測る
; scale  = 部品の大きさの倍率（1.0 = VSD standard スキンの 1080p 時の大きさ）
; show   = 1 表示 / 0 非表示
; 色は #RRGGBB または #AARRGGBB（AA = 不透明度）
; 画像のパスは、この ini のフォルダからの相対パスでもよい

[global]
font  = Impact             ; フォント名（impact.ttf のようにファイル名でもよい）
jfont = Meiryo UI          ; font に無い文字（日本語のドライバー名など）に使うフォント

[speedometer]
show   = 1
anchor = bottomleft
x      = 15
y      = 10
scale  = 0.6
image  = standard.png       ; VSD のメーター画像。見つからなければ代わりの円盤を描く
step   = 10                ; 大目盛りの刻み [km/h]
margin = 5                 ; 最高値 = GPS 最高速 + margin を step で切り上げ
max    = 0                 ; 0 以外なら最高値をこの値に固定
wide   = 140               ; 最高値がこれを超えたら、数字は step×2 ごと (10 なら 20 km/h ごと) にだけ書く。0 で常に step ごと
smooth = 2.0               ; 針をならす時間幅 [秒]。大きいほどゆったり動く（0 で点の間を直線でつなぐだけ）
needle = #FF0000
color  = #FFFFFF

[gmeter]
show   = 1
anchor = bottomleft
x      = 278
y      = 10
scale  = 0.6
range  = 1.5               ; 外周の G
ball   = #FF4000
line   = #802000
trail  = 20                ; G の軌跡の長さ [フレーム]
smooth = 1.0               ; G を求める時間幅 [秒]。大きいほど滑らか（1Hz のログは 1〜2）

[tacho]
; エンジンの回転数 (横棒) とアクセル (縦棒)。「走行動画の時刻合わせ」で音声を解析した結果 (ログ名.engine.json) があるときだけ出る
; 回転数 = 係数 × 速度 (直結のカート)。この節が無いレイアウトでも、解析結果があれば既定の位置 (加速度計と情報の上) に出る
show     = 1
anchor   = bottomleft
x        = 278
y        = 174
scale    = 1.0
opacity  = 0.8             ; 全体の不透明度 (1 で不透明、小さいほど透ける)
max      = 16000           ; 目盛りの最高値 [rpm]
yellow   = 13000           ; ここから黄色
red      = 15000           ; ここから赤
segments = 32              ; 目盛りの区切りの数
throttle = 1               ; アクセルの縦棒 (1 表示 / 0 非表示)
gear     = 1               ; 変速機付きの車: アクセルの縦棒の所にギアの数字 (1 表示 / 0 非表示)。目盛りは解析結果の画面で入れた値を使う
gearcolor = #FFFFFF
slip     = 8               ; 音の回転数が速度からの回転数よりこの % 以上高いと「SLIP」(後輪の空転・スライド)。0 で出さない
barcolor = #40C0FF
throttlecolor = #40E060
back     = #70000000

[map]
show      = 1
anchor    = topleft
x         = 20
y         = 20
width     = 420
height    = 260
line      = #FFFF00
linewidth = 3
dot       = #FF0000
dotsize   = 7
gates     = 1              ; コントロールライン・セクターラインを描く
controlcolor = #FFFFFF
gatecolor = #00C0FF
gatewidth = 3
gatelength = 22
background = 0             ; 1 で下に薄い背景を敷く (レイアウトエディタの「背景」)
panel     = #1F000000      ; 背景の色 (#AARRGGBB。先頭 2 桁が濃さ。グラフの back = 0.12 と同じ濃さ)
panelopacity = 0.12        ; 背景の濃さ (0〜1。色の先頭 2 桁より優先)
panelpad  = 16             ; 背景の余白

[session]
; ドライバー名と心拍 (セッション番号はラップタイムの先頭の行に出す)
show   = 1
anchor = topright
x      = 20
y      = 15
size   = 30
color  = #FFFFFF
background = 0
panel  = #1F000000
panelopacity = 0.12
panelpad = 8

[heart]
; 心拍 (ドライバー名の右にハートと 3 桁の数字)。「走行動画の時刻合わせ」で FIT ファイルを合わせた結果 (ログ名.heart.json) があるときだけ出る
; 位置と文字の大きさは [session] に従う。この節が無いレイアウトでも、合わせた結果があれば出る
show     = 1
color    = #FF2040          ; 拍の瞬間のハートの色
dim      = #601018          ; 次の拍の直前のハートの色
decay    = 4.0              ; 明るさが落ちる速さ (大きいほど一瞬だけ光る)
numcolor = #FFFFFF          ; 心拍数の文字の色

[laptime]
show   = 1
anchor = topright
below  = session           ; ドライバー・心拍の下に続ける（非表示なら画面の端から y）
session = 1                ; 先頭の行にセッション番号 (Session 3) を出す (ジムカーナは出さない)
x      = 20
y      = 12
size   = 34                ; 文字の高さ
color  = #FFFFFF
bestline = #A0FF40           ; Best の行（その時点のベスト）
best   = #00FFFF             ; 履歴の中のベストの周回・区間
plus   = #FF0000
minus  = #4080FF
laps   = 3                 ; 表示する過去の周回数
hold   = 3                 ; ラインを通ったあと、その周回のタイムと差分を表示しておく秒数
background = 0             ; 1 で下に薄い背景を敷く (レイアウトエディタの「背景」)
panel     = #1F000000      ; 背景の色 (#AARRGGBB。先頭 2 桁が濃さ)
panelopacity = 0.12        ; 背景の濃さ (0〜1。色の先頭 2 桁より優先)
panelpad  = 10             ; 背景の余白

[sector]
show   = 1
anchor = bottomright
x      = 20
y      = 15
size   = 30
color  = #FFFFFF
running = #FFFF80           ; 走行中の区間（経過時間）
bestline = #A0FF40           ; Best の行（その時点のベスト）
best   = #00FFFF             ; 履歴の中のベストの周回・区間
plus   = #FF0000
minus  = #4080FF
laps   = 3
hold   = 3
follow = 1                 ; ジムカーナではラップタイムの下に右端をそろえて置く (0 で x・y の位置。エディタで動かすと 0 になる)
background = 0
panel  = #1F000000
panelopacity = 0.12        ; 背景の濃さ (0〜1。色の先頭 2 桁より優先)
panelpad = 10

[graph]
; 距離ごとの速度のグラフ（横軸 = スタート / コントロールラインからの距離、縦軸 = 速度）
; その時点のベストの周回を透過の面と線で背景に描き、走行中の周回を線で伸ばしていく（ラインを通ると消えて描き直す）
; 任意の表示。出し入れは画面の「速度のグラフ」のチェック（動画素材の書き出し・走行動画の時刻合わせ・動画で比較で共通。ini の show は使わない）
; この節が無いレイアウトでも、チェックすれば下の既定の値で出る。下の値は色・大きさを変えたいときだけ
above     = sector          ; セクター表示の上に、右端をそろえて置く（ジムカーナ・セクター非表示のときは anchor / x / y の位置）
anchor    = bottomright
x         = 20
y         = 12              ; above のときはセクター表示との間隔
width     = 0               ; 0 = セクター表示と同じ幅（above でないときは 480）
height    = 220             ; 右上のラップタイムに重なる分は自動で縮める
current   = #FFFF80         ; 走行中の周回の線
best      = #00FFFF         ; ベストの周回の線と面
fill      = 0.10            ; ベストの面の不透明度（0 〜 1。小さいほど下の映像が透ける）
back      = 0.12            ; グラフ全体の下敷き（黒）の不透明度
linewidth = 3
dotsize   = 8               ; 走行中の周回の今いる所の点
gates     = 1               ; ラインの位置の縦線と名前
gatecolor = #FFFFFF
labelsize = 22
opacity   = 1

[info]
show   = 1
anchor = bottomleft
x      = 420
y      = 12
size   = 26
color  = #C0A0A0A0
items  = DateTime, Elapsed, Lat, Lng, Alt, Dist   ; ほかに Speed, G

[subvideo]
; サブ動画 (ペダルなど別のカメラ。時刻合わせの画面で登録した動画) を重ねる枠。サブ動画が無い時刻は何も描かない
; トリミング (上下左右) はサブ動画ごとに ログ名.log.json に保存する (ここには枠だけ)
; トリミングした絵を、縦横比を変えずに枠に収まる最大の大きさにする。重なり順は メインの映像 → サブ動画 → ほかの表示
show   = 1
anchor = bottomleft   ; 枠の基準の角
x      = 15
y      = 220
width  = 480          ; 枠の大きさ (1920x1080 基準)
height = 270
align  = center       ; 枠より小さいときの寄せ方 center / left / right / top / bottom ("top left" のように組み合わせ可)
border = 2            ; 枠線の太さ (0 で無し)
bordercolor = #80FFFFFF
opacity = 1.0
