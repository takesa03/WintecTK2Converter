; オーバーレイ表示のレイアウト（VSD のスキンに相当）
; 座標・大きさは 1920x1080 を基準にした画素数。ほかの解像度では自動で拡大縮小する
; anchor = 基準にする画面の隅（topleft / topright / bottomleft / bottomright）
; x, y   = その隅から部品の同じ隅までの距離（内側が正）。メーターは画像の見えている部分の端で測る
; scale  = 部品の大きさの倍率（1.0 = VSD standard スキンの 1080p 時の大きさ）
; show   = 1 表示 / 0 非表示
; 色は #RRGGBB または #AARRGGBB（AA = 不透明度）
; 画像のパスは、この ini のフォルダからの相対パスでもよい

[global]
font  = Impact             ; フォント名（impact.ttf のようにファイル名でもよい）
jfont = Meiryo UI          ; font に無い文字（日本語のドライバー名など）に使うフォント

[speedometer]
show   = 1
anchor = bottomleft
x      = 15
y      = 10
scale  = 0.6
image  = standard.png       ; VSD のメーター画像。見つからなければ代わりの円盤を描く
step   = 10                ; 大目盛りの刻み [km/h]
margin = 5                 ; 最高値 = GPS 最高速 + margin を step で切り上げ
max    = 0                 ; 0 以外なら最高値をこの値に固定
smooth = 2.0               ; 針をならす時間幅 [秒]。大きいほどゆったり動く（0 で点の間を直線でつなぐだけ）
needle = #FF0000
color  = #FFFFFF

[gmeter]
show   = 1
anchor = bottomleft
x      = 278
y      = 10
scale  = 0.6
range  = 1.5               ; 外周の G
ball   = #FF4000
line   = #802000
trail  = 20                ; G の軌跡の長さ [フレーム]
smooth = 1.0               ; G を求める時間幅 [秒]。大きいほど滑らか（1Hz のログは 1〜2）

[map]
show      = 1
anchor    = topleft
x         = 20
y         = 20
width     = 420
height    = 260
line      = #FFFF00
linewidth = 3
dot       = #FF0000
dotsize   = 7
gates     = 1              ; コントロールライン・セクターラインを描く
controlcolor = #FFFFFF
gatecolor = #00C0FF
gatewidth = 3
gatelength = 22

[session]
show   = 1
anchor = topright
x      = 20
y      = 15
size   = 30
color  = #FFFFFF

[laptime]
show   = 1
anchor = topright
below  = session           ; セッション情報の下に続ける（非表示なら画面の端から y）
x      = 20
y      = 12
size   = 34                ; 文字の高さ
color  = #FFFFFF
bestline = #A0FF40           ; Best の行（その時点のベスト）
best   = #00FFFF             ; 履歴の中のベストの周回・区間
plus   = #FF0000
minus  = #4080FF
laps   = 3                 ; 表示する過去の周回数
hold   = 3                 ; ラインを通ったあと、その周回のタイムと差分を表示しておく秒数

[sector]
show   = 1
anchor = bottomright
x      = 20
y      = 15
size   = 30
color  = #FFFFFF
running = #FFFF80           ; 走行中の区間（経過時間）
bestline = #A0FF40           ; Best の行（その時点のベスト）
best   = #00FFFF             ; 履歴の中のベストの周回・区間
plus   = #FF0000
minus  = #4080FF
laps   = 3
hold   = 3

[info]
show   = 1
anchor = bottomleft
x      = 420
y      = 12
size   = 26
color  = #C0A0A0A0
items  = DateTime, Elapsed, Lat, Lng, Alt, Dist   ; ほかに Speed, G
