; tk2nmea.ini - tk2nmea.exe の設定 (exe と同じフォルダに置く)
; 行頭の ; はコメント。書き換えて保存すれば次回のドロップから反映されます。
; コマンドラインのオプション (-kmicon など) を付けた場合はそちらが優先されます。

; ===== Km ポスト (1km ごとの目印) =====
; シンボル: pin / flag / star / circle / square / diamond / triangle / target / donut / dot / paddle
;           または画像の URL (http://...)、または png ファイル (exe からの相対パスまたはフルパス)
;           見本: kmicon_samples.kmz を Google Earth で開くと並べて比較できます
kmicon=square
; 色: white / yellow / orange / red / pink / magenta / purple / blue / cyan / green / black
;     または #RRGGBB (例 #FFCC00)
kmcolor=yellow
; シンボルの大きさ (1 = 標準)
kmscale=1
; ラベル (「5 Km」の文字) の大きさ (0 で非表示)
kmlabel=1

; ===== Speed_Track(Km) の色分け =====
; 色分けの幅 [km/h]。20 にすると TimeMachineX と同じ 7 色になります
speedstep=5
; この速度以上は最高色 (赤) [km/h]
speedmax=120

; ===== 高さの表示 =====
; gps    : GPS で記録した高度で線を描く (橋・高架道路の上に線が乗る)
; ground : 地表に沿わせる (Google Earth の地形には橋が無いので、橋の上では海面や地面に線が描かれる)
altitude=ground
; GPS 高度の補正値 [m]。線が道路より浮いて見えるときはマイナスにする (例 -10)
altoffset=0
; altitude=ground のとき、線・マーカー・カメラを地表から浮かせる高さ [m] (道路に隠れて見えにくいとき用。0 で浮かせない)
groundoffset=1
; GPS 高度の移動平均の幅 [秒] (0 で平滑化なし)
altsmooth=5
; 1 にすると線から地面まで半透明の幕を下ろして表示 (高さが分かりやすい)
extrude=0

; ===== 走行アニメーション (Google Earth のツアー) =====
; 1 = ツアーを作る。「場所」パネルの「走行アニメーション」をダブルクリックで再生。
;     走った所だけ Speed_Track の線が描かれていき、残ります
;     (ツール → ムービーメーカー で動画に保存できます)
; 0 = 作らない (線は最初から全部表示)
tour=1
; 再生の倍速 (10 なら 1 時間の走行を 6 分で再生)
tourspeed=1
; カメラ位置の間隔 [秒] (小さいほど滑らか、ファイルは大きくなる)
tourstep=1
; カメラから車までの距離 [m]
tourrange=200
; カメラの傾き [度] (0 = 真上から見下ろす, 90 = 水平)
tourtilt=60
; follow = 進行方向を向く / north = 常に北が上
tourheading=follow
; 軌跡の線の先端の位置の補正 [秒]。0 = 車が通過した点まで描く。+1 にすると先端が車より約1秒先まで伸びる、-1 で後ろに下がる
tourlead=0
; 記録点の間 (通常 1 秒) を何分割して軌跡を伸ばすか。2 = 0.5 秒刻み, 3 = 1/3 秒刻み (1 = 分割しない)。大きいほどファイルが大きくなる
tourseg=1
; 進行方向を求める範囲 [秒] (前後それぞれ)。大きいほどカーブでカメラが振られにくい
tourheadwin=5
; カメラの向きの追従の遅れ [秒]。0 = 進行方向にすぐ向く。大きいほどゆっくり追従 (目安: 3～10)
tourheadtau=10

; ===== 走行軌跡の表示 =====
; 1 にすると、走行軌跡 (時間再生) 自身の線を表示する。Google Earth が時間に合わせて車の位置まで滑らかに線を伸ばす (単色)。
; このとき Speed_Track(Km) の色分けは非表示になる (フォルダにチェックを入れれば表示できる)。0 なら色分けの線をツアーに合わせて伸ばす。
trackline=0
; trackline=1 のときの線の色 (名前 / #RRGGBB) と太さ
trackcolor=orange
trackwidth=4
; 自車マーカーの下に表示するラベル (車種名など)。空なら表示しない
carname=
; ラベルの大きさ
carlabel=1.2

; ===== 出力 =====
; Google Earth 用ファイル: kmz / kml / none
googleearth=kmz
; NMEA の RMC 日付を日本時間の日付にする: 0 = UTC (規格どおり) / 1 = 日本時間
localdate=0
